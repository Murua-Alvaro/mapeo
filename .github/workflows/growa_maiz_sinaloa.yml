name: GROWA - verificar capa satelital de maiz
on:
  push:
    branches: [growa-maiz-clasificacion]
  workflow_dispatch:
jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Consultar WorldCereal desde internet
      run: |
        python -m pip install -q requests pillow
        python - <<'PY'
        import requests,io,collections,json
        from PIL import Image
        queries = [
          ('stac','https://stac.terrascope.be/search', dict(collections='esa-worldcereal-maize-10m-2021-v1',bbox='-107.16,23.78,-106.6,24.29', limit='3')),
          ('wms','https://titiler.terrascope.be/wms',dict(service='WMS',version='1.1.1',request='GetMap',layers='esa-worldcereal-maize-10m-2021-v1_classification',styles='',srs='EPSG:4326',bbox='-107.0,24.0,-106.98,24.02',width=512,height=512,format='image/png',transparent='true')),
        ]
        for name,url,params in queries:
          try:
            r=requests.get(url,params=params,timeout=90)
            print(name,r.status_code,r.headers.get('content-type'),len(r.content),r.url)
            if 'image' in r.headers.get('content-type',''):
              im=Image.open(io.BytesIO(r.content)).convert('RGBA')
              print('COLORS',collections.Counter(im.getdata()).most_common(16))
              im.save(name+'_elota.png')
            else:
              print('BODY',r.text[:2800])
          except Exception as e:print('ERROR',name,str(e))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: prueba-maiz-terrascope
        path: '*_elota.png'
        if-no-files-found: ignore
